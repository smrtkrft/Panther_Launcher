# Builds the project
name: Android Feature Branch CI

on:
  push:
    branches:
      - '*'
      - '*/**'
      - '!*main*'
      - '!*translate*'
  workflow_dispatch:

jobs:
  build:
    name: Build, Sign & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.GIT_BOT_TOKEN }}
          ref: main

      - name: set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stop Gradle daemons
        run: ./gradlew --stop

      - name: Decode keystore
        id: write_base64_file
        shell: bash
        run: |
          echo "${{ secrets.SIGNINGKEY_BASE64 }}" > pantherlauncher.jks.tmp
          base64 -d -i pantherlauncher.jks.tmp > pantherlauncher.jks
          rm pantherlauncher.jks.tmp

          mkdir -p app
          mv pantherlauncher.jks app/

          DESTINATION_FILE="app/pantherlauncher.jks"
          echo "filePath=$DESTINATION_FILE" >> "$GITHUB_OUTPUT"
          echo "Keystore written to $DESTINATION_FILE"

      - name: Build with Gradle
        run: ./gradlew clean assembleProdRelease --refresh-dependencies --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Dhttps.protocols=TLSv1.2"
          KEY_STORE_FILE: ${{ steps.write_base64_file.outputs.filePath }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Secure keystore cleanup
        if: always()
        shell: bash
        run: |
          shred -u app/pantherlauncher.jks || rm -f app/pantherlauncher.jks
