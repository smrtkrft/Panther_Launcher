name: Validate Gradle Wrapper

on:
  push:
    paths:
      - '**/gradle/wrapper/**'
      - '**/gradlew'
      - '**/gradlew.bat'
  pull_request:
    paths:
      - '**/gradle/wrapper/**'
      - '**/gradlew'
      - '**/gradlew.bat'

# Read-only: this workflow only inspects the checked-out files
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper JAR
        uses: gradle/wrapper-validation-action@v3.5.0
